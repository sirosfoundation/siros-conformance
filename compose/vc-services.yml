# VC Services (issuer, verifier, apigw, registry, mockas)
#
# All images from ghcr.io/sirosfoundation/ — no local builds.

services:
  mongodb:
    image: mongo:7.0
    container_name: vc-mongodb
    ports:
      # Debug-only host mapping (the services talk over the internal
      # network); 27117 stays out of the way of a host mongod.
      - "27117:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - conformance-network

  vc-registry:
    image: ${VC_REGISTRY_IMAGE:-ghcr.io/sirosfoundation/vc/registry:latest}
    container_name: vc-registry
    ports:
      - "9004:8080"
      - "9094:8090"
    volumes:
      - ../fixtures/vc-config.yaml:/config.yaml:ro
      - ../fixtures/vc-pki:/pki:ro
      - ../fixtures/vc-metadata:/metadata:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - conformance-network

  vc-issuer:
    image: ${VC_ISSUER_IMAGE:-ghcr.io/sirosfoundation/vc/issuer:latest}
    container_name: vc-issuer
    ports:
      - "9000:8080"
      - "9190:8090"
    volumes:
      - ../fixtures/vc-config.yaml:/config.yaml:ro
      - ../fixtures/vc-pki:/pki:ro
      - ../fixtures/vc-metadata:/metadata:ro
      - ../fixtures/vc-metadata:/metadata:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
      vc-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - conformance-network

  vc-verifier:
    image: ${VC_VERIFIER_IMAGE:-ghcr.io/sirosfoundation/vc/verifier:latest}
    container_name: vc-verifier
    ports:
      - "9001:8080"
      - "9091:8090"
    volumes:
      - ../fixtures/vc-config.yaml:/config.yaml:ro
      - ../fixtures/vc-pki:/pki:ro
      - ../fixtures/vc-metadata:/metadata:ro
      - ../fixtures/vc-metadata:/metadata:ro
      - ../fixtures/vc-presentation-requests:/presentation_requests:ro
      - ../fixtures/oauth-metadata-verifier.json:/oauth-metadata.json:ro
      - ../fixtures/verifier-static:/static:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - conformance-network

  vc-apigw:
    image: ${VC_APIGW_IMAGE:-ghcr.io/sirosfoundation/vc/apigw:latest}
    container_name: vc-apigw
    ports:
      - "9003:8080"
    volumes:
      - ../fixtures/vc-config.yaml:/config.yaml:ro
      - ../fixtures/vc-pki:/pki:ro
      - ../fixtures/vc-metadata:/metadata:ro
      - ../fixtures/vc-metadata:/metadata:ro
      - ../fixtures/oauth-metadata-apigw.json:/oauth-metadata.json:ro
    environment:
      - VC_CONFIG_YAML=/config.yaml
      - SSL_CERT_FILE=/pki/rootCA.crt
    depends_on:
      mongodb:
        condition: service_healthy
      vc-issuer:
        condition: service_healthy
      vc-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - conformance-network

  # The 0.7.20 vc stack's OIDC provider: navikt mock-oauth2-server, as
  # the vc repo's own docker-compose runs it (the pre-0.7 vc-mockas
  # image is gone with the old config schema it parsed). Serves the
  # issuer at /default — the apigw's auth_providers.oidc issuer_url in
  # fixtures/vc-config.yaml points at http://vc-mockas:8080/default.
  vc-mockas:
    image: ${VC_MOCKAS_IMAGE:-ghcr.io/navikt/mock-oauth2-server:2.1.10}
    container_name: vc-mockas
    ports:
      - "9002:8080"
    environment:
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/default/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - conformance-network

volumes:
  mongodb-data:

networks:
  conformance-network:
    driver: bridge
