# The mini-wallet's nginx site: the static wasm page, plus the CRL the
# mdoc fixture DS certificate's distribution point names (served with
# the RFC 2585 §4.2 content type — nginx's stock mime.types maps no
# pkix-crl, so the location sets it).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location = /mini-test.crl {
        # nginx's stock mime.types maps no pkix-crl: this location sets
        # the type itself (RFC 2585 §4.2).
        default_type application/pkix-crl;
    }
    location / {
    }
}