# Wallet stack (frontend, backend, VCTM registry)
#
# All images from ghcr.io/sirosfoundation/ — no local builds.
# wallet-backend uses network_mode: host for proxy requests to localhost services.

services:
  wallet-frontend:
    image: ghcr.io/sirosfoundation/wallet-frontend:latest
    container_name: wallet-frontend
    ports:
      - "3000:80"
    environment:
      - WALLET_BACKEND_URL=http://localhost:8080
      - WALLET_ENGINE_URL=http://localhost:8082
      - WEBAUTHN_RPID=localhost
      - OPENID4VCI_REDIRECT_URI=http://localhost:3000/
      - STATIC_PUBLIC_URL=http://localhost:3000
      - STATIC_NAME=Conformance Test Wallet
      - VCT_REGISTRY_URL=http://localhost:8097/type-metadata
      - TRANSPORT_PREFERENCE=websocket
      - ALLOWED_TRANSPORTS=http,websocket
      - LOG_LEVEL=debug
      - DISPLAY_CONSOLE=true
      - LOGIN_WITH_PASSWORD=false
      - DID_KEY_VERSION=jwk_jcs-pub
      - OPENID4VCI_PROOF_TYPE_PRECEDENCE=attestation,jwt
      - OPENID4VP_SAN_DNS_CHECK=false
      - OPENID4VP_SAN_DNS_CHECK_SSL_CERTS=false
      - DELEGATE_TRUST_TO_BACKEND=true
      - MULTI_LANGUAGE_DISPLAY=true
      - DISPLAY_ISSUANCE_WARNINGS=false
      - BASE_PATH=/id/default/
    depends_on:
      wallet-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - conformance-network

  wallet-backend:
    image: ghcr.io/sirosfoundation/go-wallet-backend:latest
    container_name: wallet-backend
    network_mode: host
    command: ["--mode=all"]
    environment:
      - WALLET_JWT_SECRET=test-secret-for-e2e-testing-minimum-32-chars
      - WALLET_SERVER_WEBAUTHN_DISPLAY_NAME=Conformance Test Wallet
      - WALLET_SERVER_RP_ID=localhost
      - WALLET_SERVER_RP_ORIGIN=http://localhost:3000
      - WALLET_SERVER_PORT=8080
      - WALLET_SERVER_ADMIN_PORT=8081
      - WALLET_SERVER_ENGINE_PORT=8082
      - WALLET_SERVER_ADMIN_TOKEN=e2e-test-admin-token-for-testing-purposes-only
      - WALLET_LOG_LEVEL=debug
      - WALLET_TRUST_PDP_URL=http://localhost:9095
      - WALLET_TRUST_ENABLED=true
      - WALLET_HTTP_CLIENT_ALLOW_PRIVATE_IPS=true
      - WALLET_HTTP_CLIENT_ALLOW_HTTP=true
      # Skip TLS verification for conformance suite's self-signed cert
      - WALLET_HTTP_CLIENT_INSECURE_SKIP_VERIFY=true

  wallet-registry:
    image: ghcr.io/sirosfoundation/go-wallet-registry:latest
    container_name: wallet-registry
    network_mode: host
    environment:
      - REGISTRY_SERVER_HOST=0.0.0.0
      - REGISTRY_SERVER_PORT=8097
      - REGISTRY_SOURCE_URL=https://registry.siros.org/.well-known/vctm-registry.json
      - REGISTRY_SOURCE_POLL_INTERVAL=5m
      - REGISTRY_CACHE_PATH=/app/data/vctm-cache.json
      - REGISTRY_DYNAMIC_CACHE_ENABLED=true
      - REGISTRY_DYNAMIC_CACHE_DEFAULT_TTL=1h
      - REGISTRY_DYNAMIC_CACHE_MAX_TTL=24h
      - REGISTRY_DYNAMIC_CACHE_MIN_TTL=1m
      - REGISTRY_JWT_REQUIRE_AUTH=false
      - REGISTRY_RATE_LIMIT_UNAUTHENTICATED_RPM=1000
      - REGISTRY_RATE_LIMIT_BURST_MULTIPLIER=10
      - REGISTRY_LOGGING_LEVEL=debug

networks:
  conformance-network:
    driver: bridge
