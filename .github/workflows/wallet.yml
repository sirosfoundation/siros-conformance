name: Wallet Conformance

on:
  workflow_dispatch:
    inputs:
      target-repo:
        description: 'Post summary comment to this repo (owner/repo)'
        required: false
        default: ''
        type: string
      target-pr:
        description: 'PR number to comment on (empty = latest open PR)'
        required: false
        default: ''
        type: string
      image-overrides:
        description: 'JSON map of service→tag overrides, e.g. {"wallet-frontend":"pr-111"}'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [conformance-wallet]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 06:00 UTC
  push:
    branches: [main]
    paths:
      - 'specs/conformance/oid4vci-wallet.spec.ts'
      - 'specs/conformance/oid4vp-wallet.spec.ts'
      - 'helpers/**'
      - 'configs/conformance/vci-wallet-config.json'
      - 'configs/conformance/vp-wallet-config.json'
      - 'compose/wallet.yml'
      - 'compose/conformance-suite.yml'
      - '.github/workflows/wallet.yml'

concurrency:
  group: wallet-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Add /etc/hosts entry
        run: echo "127.0.0.1 localhost.emobix.co.uk" | sudo tee -a /etc/hosts

      - name: Apply image overrides
        run: |
          OVERRIDES='${{ inputs.image-overrides || toJSON(github.event.client_payload.image-overrides) }}'
          if [ -n "$OVERRIDES" ] && [ "$OVERRIDES" != '""' ] && [ "$OVERRIDES" != 'null' ]; then
            eval "$(node scripts/parse-deps.mjs --json "$OVERRIDES")"
            node scripts/parse-deps.mjs --json "$OVERRIDES" --env-file >> $GITHUB_ENV
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker compose \
            -f compose/wallet.yml \
            -f compose/go-trust.yml \
            -f compose/vc-services.yml \
            -f compose/conformance-suite.yml \
            pull

      - name: Start services
        run: |
          docker compose \
            -f compose/wallet.yml \
            -f compose/go-trust.yml \
            -f compose/vc-services.yml \
            -f compose/conformance-suite.yml \
            up -d
          echo "Waiting for wallet backend..."
          timeout 120 bash -c 'until curl -sf http://localhost:8081/health 2>/dev/null || curl -sf http://localhost:8080/health 2>/dev/null; do sleep 5; done'
          echo "Waiting for wallet frontend..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000/ 2>/dev/null; do sleep 5; done'
          echo "Waiting for VC services..."
          timeout 120 bash -c 'until curl -sf http://localhost:9003/.well-known/oauth-authorization-server 2>/dev/null; do sleep 5; done'
          echo "Waiting for conformance suite..."
          timeout 180 bash -c 'until curl -fsk https://localhost.emobix.co.uk:8443/login.html; do sleep 10; done'
          echo "All services ready"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run wallet VCI conformance tests
        run: npx playwright test specs/conformance/oid4vci-wallet.spec.ts
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          CONFORMANCE_URL: https://localhost.emobix.co.uk:8443/
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8080
          ADMIN_URL: http://localhost:8081
          CONFORMANCE_RESULTS_DIR: ./conformance-results

      - name: Run wallet VP conformance tests
        run: npx playwright test specs/conformance/oid4vp-wallet.spec.ts
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
          CONFORMANCE_URL: https://localhost.emobix.co.uk:8443/
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8080
          ADMIN_URL: http://localhost:8081
          CONFORMANCE_RESULTS_DIR: ./conformance-results

      - name: Generate job summary
        if: always()
        run: |
          for f in conformance-results/*-summary.json; do
            [ -f "$f" ] && break
            exit 0
          done
          node scripts/generate-summary.mjs ./conformance-results \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            >> $GITHUB_STEP_SUMMARY

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-conformance-report
          path: conformance-results/
          retention-days: 90

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Collect logs on failure
        if: failure()
        run: |
          docker compose \
            -f compose/wallet.yml \
            -f compose/go-trust.yml \
            -f compose/vc-services.yml \
            -f compose/conformance-suite.yml \
            logs --tail=200 > docker-logs.txt 2>&1

      - name: Upload docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-docker-logs
          path: docker-logs.txt
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          docker compose \
            -f compose/wallet.yml \
            -f compose/go-trust.yml \
            -f compose/vc-services.yml \
            -f compose/conformance-suite.yml \
            down -v

  post-summary:
    needs: wallet-conformance
    if: |
      always() && (
        inputs.target-repo != '' ||
        github.event.client_payload.target-repo != '' ||
        github.event_name == 'schedule'
      )
    uses: ./.github/workflows/post-summary.yml
    with:
      target-repo: ${{ inputs.target-repo || github.event.client_payload.target-repo || '' }}
      target-pr: ${{ inputs.target-pr || github.event.client_payload.target-pr || '' }}
    secrets:
      pr-token: ${{ secrets.CONFORMANCE_PR_TOKEN }}
