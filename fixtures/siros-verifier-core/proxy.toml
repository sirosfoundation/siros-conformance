# siros-verifier-core under the OpenID Foundation conformance suite.
# Static keys and HTTP are local-test-only; the suite's go-trust service allows all issuers.
base_url = "https://conformance.example.com:9443"
state_encryption_key = "conformance-state-master-key-32-bytes"
previous_state_encryption_keys = ["conformance-previous-master-32bytes"]
cookie_name = "SIROS_VERIFIER_STATE"
cookie_secure = false
cookie_same_site = "Lax"
state_cookie_max_age = 900
attributes = "/etc/siros-verifier/attributes.toml"

[logging]
level = "info"
format = "json"

[[frontend]]
type = "ui"
name = "ui"
  [frontend.config]
  invocations = ["qr", "dc-api", "link"]
  schemes = ["openid4vp", "haip", "haip-vp", "mdoc-openid4vp"]

[[frontend]]
type = "oidc"
name = "OIDC"
  [frontend.config]
  signing_key_path = "/pki/signing_ec_private.pem"
  signing_algorithm = "ES256"
  signing_key_id = "siros-verifier-op"

  [[frontend.config.clients]]
  client_id = "e2e-test-client"
  redirect_uris = ["http://localhost:3000/cb"]
  response_types = ["code"]
  grant_types = ["authorization_code", "refresh_token"]
  token_endpoint_auth_method = "none"

[[backend]]
type = "openid4vp"
name = "vp"
  [backend.config]
  request_signing_key_path = "/pki/signing_ec_private.pem"
  request_certificate_chain_path = "/etc/siros-verifier/signing_ec_leaf.pem"
  pdp_endpoint = "http://go-trust-allow:6001/evaluation"
  pdp_id = "go-trust"
  allow_insecure_http = true
  allow_invalid_status_list_certificates = true
  receipt_key_id = "siros-receipt"
  receipt_issuer = "siros-verifier-core"
  receipt_audience = "vp"
  max_receipt_ttl_secs = 300
  role = "pid-provider"
  request_ttl_secs = 300
  request_uri_method = "post"
  subject_pointer = "/given_name"
  dcql = { credentials = [{ id = "eudi_pid", format = "dc+sd-jwt", meta = { vct_values = ["urn:eudi:pid:1"] }, claims = [{ path = ["given_name"] }] }] }
  attribute_map = { givenname = "/given_name" }

  [backend.config.storage]
  backend = "mongodb"
  uri = "mongodb://mongodb:27017"
  database = "siros_verifier"
  collection = "presentation_flows"
