events {}

http {
  server {
    listen 9443 ssl;
    server_name issuer.conformance.example.com;

    ssl_certificate /etc/nginx/tls.crt;
    ssl_certificate_key /etc/nginx/tls.key;

    # BCP195 recommended ciphers only (the suite's
    # RequireOnlyBCP195RecommendedCiphersForTLS12 warns otherwise).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;

    # The document-signer CA's CRL (ISO 18013-5 Table B.3: the DS cert
    # names this URI; the suite's FetchMdocDsCertificateCrl fetches and
    # parses it — DER, application/pkix-crl).
    location /crl/ca.crl {
      default_type application/pkix-crl;
      alias /etc/nginx/crl/ca.crl;
    }

    # LOCAL-TEST-ONLY status-list stub (fixtures/siros-issuer-core/
    # status-stub.mjs) — sirosfoundation/siros-status-service#20.
    location /status/ {
      proxy_pass http://siros-issuer-core-status:8080/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass http://siros-issuer-core:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}