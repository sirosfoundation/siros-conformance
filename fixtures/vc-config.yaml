# VC Services Configuration for Conformance Testing
#
# NOTE: This config targets the Jan 2026 (:latest) Docker image config schema.
# The vc source code has since been refactored — if images are rebuilt,
# this file may need updating.
#
# Service Ports:
#   - 9000: vc-issuer (OpenID4VCI)
#   - 9001: vc-verifier (OpenID4VP + OIDC)
#   - 9002: vc-mockas (Mock Auth Server)
#   - 9003: vc-apigw (API Gateway / OAuth AS)
#   - 9004: vc-registry (Status Lists)

---
common:
  production: false
  mongo:
    uri: mongodb://mongodb:27017
  tracing:
    addr: "localhost:4318"
    type: "noop"
    timeout: 1
  credential_offer:
    type: "credential_offer"
    issuer_url: "http://localhost:9003"
    wallet_url: "http://localhost:3000/cb"
    qr:
      recovery_level: 2
      size: 256
  kafka:
    enabled: false
    brokers:
      - "kafka0:9092"

# =============================================================================
# API Gateway (apigw)
# =============================================================================
apigw:
  api_server:
    addr: ":8080"
  external_server_url: "http://localhost:9003"
  issuer_client:
    addr: "vc-issuer:8090"
  registry_client:
    addr: "vc-registry:8090"
  oauth_server:
    token_endpoint: "http://localhost:9003/token"
    clients:
      "e2e-test-client":
        type: "public"
        redirect_uri: "http://localhost:3000/cb"
        scopes:
          - "pid"
          - "diploma"
          - "ehic"
          - "eduid"
    metadata:
      path: "/oauth-metadata.json"
      signing_key_path: "/pki/signing_ec_private.pem"
      signing_chain_path: "/pki/signing_ec_chain.pem"

# =============================================================================
# Issuer Service
# =============================================================================
issuer:
  api_server:
    addr: ":8080"
  grpc_server:
    addr: ":8090"
  identifier: "http://localhost:9003"
  issuer_url: "http://localhost:9003"
  signing_key_path: "/pki/signing_ec_private.pem"
  registry_client:
    addr: "vc-registry:8090"
  jwt_attribute:
    issuer: "http://localhost:9003"
    enable_not_before: true
    valid_duration: 3600
    verifiable_credential_type: "https://credential.e2etest.local/identity_credential"

# =============================================================================
# Verifier Service
# =============================================================================
verifier:
  api_server:
    addr: ":8080"
  grpc_server:
    addr: ":8090"
  external_server_url: "http://localhost:9001"
  oauth_server:
    token_endpoint: "http://localhost:9001/token"
    clients:
      "e2e-test-client":
        type: "confidential"
        redirect_uri: "http://localhost:3000/cb"
        scopes:
          - "pid"
          - "diploma"
          - "ehic"
          - "eduid"
    metadata:
      path: "/oauth-metadata.json"
      signing_key_path: "/pki/signing_ec_private.pem"
      signing_chain_path: "/pki/signing_ec_chain.pem"

# =============================================================================
# Registry Service
# =============================================================================
registry:
  api_server:
    addr: ":8080"
  grpc_server:
    addr: ":8090"
  external_server_url: "http://localhost:9004"
  token_status_lists:
    signing_key_path: "/pki/signing_ec_private.pem"
  admin_gui:
    enabled: true
    username: "admin"
    password: "e2e-admin-password"
    session_secret: "e2e-test-session-secret-change-me"

# =============================================================================
# Mock Authentication Server
# =============================================================================
mock_as:
  api_server:
    addr: ":8080"
  datastore_url: "http://vc-apigw:8080"
  auto_approve: true
  bootstrap_users:
    - "test-user-001"
    - "test-user-002"
    - "test-user-003"
    - "100"
    - "102"
