# VC Services Configuration for Conformance Testing
#
# Targets the 0.7.20 image schema (the config structure the vc repo's
# config.yaml documents, Nov 2026). The pre-0.7 fixture's sections —
# authentic_sources, oauth_server, mock_as — no longer exist; the
# services now share key_config blocks, and the apigw owns the
# data_sources and the openid4vci delivery.
#
# Service Ports (host mappings in compose/vc-services.yml):
#   - 9000: vc-issuer (OpenID4VCI)
#   - 9001: vc-verifier (OpenID4VP + OIDC)
#   - 9002: vc-mockas (Mock Auth Server)
#   - 9003: vc-apigw (API Gateway / OAuth AS)
#   - 9004: vc-registry (Status Lists)

---
common:
  production: false
  mongo:
    uri: mongodb://mongodb:27017
  credential_metadata:
    pid:
      vctm_file_path: "/metadata/vctm_pid.json"
      format: "dc+sd-jwt"
    diploma:
      vctm_file_path: "/metadata/vctm_diploma.json"
      format: "dc+sd-jwt"
    ehic:
      vctm_file_path: "/metadata/vctm_ehic.json"
      format: "dc+sd-jwt"
    eduid:
      vctm_file_path: "/metadata/vctm_eduid.json"
      format: "dc+sd-jwt"

issuer:
  api_server:
    addr: ":8080"
  grpc_server:
    addr: ":8090"
  issuer_url: "http://localhost:9003"
  registry_client:
    addr: "vc-registry:8090"
  key_config:
    private_key_path: "/pki/signing_ec_private.pem"
    chain_path: "/pki/signing_ec_chain.pem"
  jwt_attribute:
    issuer: "http://localhost:9003"
    enable_not_before: true
    valid_duration: 3600
    verifiable_credential_type: "https://credential.e2etest.local/identity_credential"

verifier:
  api_server:
    addr: ":8080"
  grpc_server:
    addr: ":8090"
  public_url: "http://localhost:9001"
  key_config:
    private_key_path: "/pki/signing_ec_private.pem"
    chain_path: "/pki/signing_ec_chain.pem"
  outbound:
    oidc_provider:
      issuer: "http://localhost:9001"
      subject_type: "public"
      subject_salt: "conformance-verifier-salt"
      code_duration: 300
      session_duration: 3600
      access_token_duration: 3600
      id_token_duration: 3600
      refresh_token_duration: 86400
  inbound:
    openid4vp:
      token_endpoint: "http://localhost:9001/token"
      clients:
        "e2e-test-client":
          type: "public"
          redirect_uri: "http://localhost:3000/cb"
          scopes:
            - "pid"
            - "diploma"
            - "ehic"
            - "eduid"
      supported_credentials:
        - vct: "urn:eudi:pid:1"
          scopes:
            - "pid"
        - vct: "https://credential.e2etest.local/identity_credential"
          scopes:
            - "diploma"
            - "ehic"
            - "eduid"

registry:
  api_server:
    addr: ":8080"
  grpc_server:
    addr: ":8090"
  public_url: "http://localhost:9004"
  token_status_lists:
    key_config:
      private_key_path: "/pki/signing_ec_private.pem"
      chain_path: "/pki/signing_ec_chain.pem"
  admin_gui:
    enable: true
    username: "admin"
    password: "e2e-admin-password"

apigw:
  key_config:
    private_key_path: "/pki/signing_ec_private.pem"
    chain_path: "/pki/signing_ec_chain.pem"
  api_server:
    addr: ":8080"
    api_auth:
      oidc:
        enable: false
  public_url: "http://localhost:9003"
  registry_public_url: "http://localhost:9004"
  issuer_client:
    addr: "vc-issuer:8090"
  registry_client:
    addr: "vc-registry:8090"
  data_sources:
    datastore:
      scopes:
        pid:
          auth_provider: oidc
          auth_claims: ["given_name", "family_name", "birth_date"]
  auth_providers:
    oidc:
      enable: true
      issuer_url: "http://vc-mockas:8080/default"
      redirect_uri: "http://localhost:9003/oidcrp/callback"
      scopes: ["openid", "profile"]
      session_duration: 300
      registration:
        preconfigured:
          enable: true
          client_id: "vc-apigw"
          client_secret: "vc-apigw-secret"
  delivery:
    openid4vci:
      token_endpoint: "http://localhost:9003/token"
      clients:
        "e2e-test-client":
          type: "public"
          redirect_uri: "http://localhost:3000/cb"
          scopes:
            - "pid"
            - "diploma"
            - "ehic"
            - "eduid"
    credential_offers:
      issuer_url: "http://localhost:9003"
      wallets:
        conformance_wallet:
          label: "Conformance Test Wallet"
          redirect_uri: "http://localhost:3000/cb"
